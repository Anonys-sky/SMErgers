{% if role != 'client' %}
<nav class="tabs" aria-label="Job sections">
  {% if role in ('pm','owner') %}
  <a href="{{ url_for('job_page', job_id=r.id) }}" class="{{ 'on' if tab == 'changes' }}">Changes</a>
  {% endif %}
  <a href="{{ url_for('bill_page', job_id=r.id) }}" class="{{ 'on' if tab == 'bill' }}">Draft bill</a>
  {% if role in ('pm','owner') %}
  <a href="{{ url_for('client_page', job_id=r.id) }}" class="{{ 'on' if tab == 'client' }}">Client confirmation</a>
  {% endif %}
  <a href="{{ url_for('history_page', job_id=r.id) }}" class="{{ 'on' if tab == 'history' }}">{{ 'Reconciliation history' if role == 'finance' else 'History' }}</a>
</nav>
{% endif %}
